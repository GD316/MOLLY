<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MOLLY 부산역점의 매장 배치와 공간, 오시는 길을 안내합니다.">
  <meta name="theme-color" content="#315f45">
  <title>Cafe — MOLLY Dessert &amp; Cafe</title>
  <link rel="icon" type="image/png" href="./favicon.png?v=2" sizes="256x256">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/paperlogy.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./css/brand-introduction.css">
  <link rel="stylesheet" href="./css/cafe-introduction.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mark" href="./index.html#brand" aria-label="MOLLY 메인 페이지">
        <img src="./images/Brand_Introduction/logo.png" alt="MOLLY">
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="./brand-introduction.html">Brand</a>
        <a href="./cafe-introduction.html" aria-current="page">Cafe</a>
        <a href="./index.html#menu">Menu</a>
        <a href="./introducing-friends.html">Friends</a>
        <a href="./index.html#goods">Goods</a>
        <a href="./index.html#popup">POP UP</a>
      </nav>
    </div>
    <div class="page-scroll-progress" role="progressbar" aria-label="페이지 스크롤 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="page-scroll-progress-fill"></span></div>
  </header>

  <main id="main" class="cafe-page">
    <section class="cafe-hero" aria-label="MOLLY 부산역점 외관">
      <img src="./images/Cafe_Introduction/burial.png" alt="햇살과 초록색 차양이 어우러진 MOLLY 멜론 카페 외관" fetchpriority="high">
    </section>

    <div class="cafe-details">
      <section class="cafe-section cafe-layout" aria-labelledby="layout-title">
        <h1 id="layout-title">매장 배치도</h1>
        <figure class="cafe-visual cafe-visual--layout">
          <img src="./images/Cafe_Introduction/Store_Layout.png" alt="화장실, 창고, 제조·세척 공간, 좌석과 주문·픽업대가 표시된 MOLLY 매장 배치도" loading="lazy">
        </figure>
      </section>

      <section class="cafe-section cafe-space" aria-labelledby="space-title">
        <h2 id="space-title">매장 공간</h2>
        <figure class="cafe-visual cafe-visual--space">
          <img src="./images/Cafe_Introduction/menu.png" alt="MOLLY 카페 좌석 공간과 멜론 디저트 진열대를 담은 사진 콜라주" loading="lazy">
        </figure>
      </section>

      <section class="cafe-section cafe-directions" aria-labelledby="directions-title">
        <h2 id="directions-title">오시는 길</h2>
        <figure class="cafe-visual cafe-visual--directions">
          <img src="./images/Cafe_Introduction/Directions.png" alt="부산역에서 MOLLY 부산역점까지 이어지는 안내 지도" loading="lazy">
        </figure>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="footer">
    <div class="footer-flower" aria-hidden="true">
      <img src="./images/main/Linear_floral_decoration.png" alt="">
      <img src="./images/main/Linear_floral_decoration.png" alt="">
      <img src="./images/main/Linear_floral_decoration.png" alt="">
      <img src="./images/main/Linear_floral_decoration.png" alt="">
    </div>
    <div class="footer-content">
      <div class="footer-brand">
        <img class="footer-logo" src="./images/main/footer_logo.png" alt="MOLLY">
      </div>
      <div class="footer-copy">
        <strong>MOLLY DESSERT &amp; CAFE</strong>
        <span class="footer-hours"><img src="./images/main/footer_time.png" alt=""><span>OPEN 11:00 <i>—</i> CLOSE 20:00</span></span>
        <div class="footer-meta-row">
          <div class="footer-social" aria-label="소셜 미디어">
            <img src="./images/main/instagram.png" alt="Instagram">
            <img src="./images/main/twitter.png" alt="X">
          </div>
          <div class="footer-legal">
            <p><span>(주)몰리앤프렌즈</span><span>대표자: 전지용</span></p>
            <p class="footer-legal-links">개인정보처리방침 <i>|</i> 이용약관 <i>|</i> 알레르기 정보 고지</p>
            <p class="footer-legal-copyright">Copyright © 2026 MOLLY &amp; FRIENDS. All Rights Reserved.</p>
          </div>
        </div>
      </div>
      <address class="footer-contact">
        <p><img src="./images/main/footer_phone.png" alt=""><span>070-1234-5678</span></p>
        <p><img src="./images/main/footer_location.png" alt=""><span>부산광역시 동구 중앙대로 210</span></p>
      </address>
    </div>
  </footer>

  <script src="./js/brand-introduction.js" defer></script>
</body>
</html>
